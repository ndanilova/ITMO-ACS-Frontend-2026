<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snimu — аренда жилья</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#content" class="visually-hidden-focusable skip-link">Перейти к содержимому</a>
  <nav class="navbar navbar-expand-lg bg-white border-bottom" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Snimu</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Открыть меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Поиск</a></li>
          <li class="nav-item"><a class="nav-link" href="messages.html">Сообщения</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
          <li class="nav-item" id="nav-auth"></li>
        </ul>
      </div>
    </div>
  </nav>

  <main id="content" class="container my-4">
    <h1 class="h3 mb-4">Найдите жильё для аренды</h1>
    <div class="row">
      <!-- фильтры -->
      <aside class="col-lg-3 mb-4" aria-label="Фильтры">
        <form id="filters" class="filters p-3 bg-white rounded">
          <div class="mb-3">
            <label class="form-label">Тип</label>
            <select class="form-select" name="type">
              <option value="">Любой</option>
              <option value="APARTMENT">Квартира</option>
              <option value="STUDIO">Студия</option>
              <option value="ROOM">Комната</option>
              <option value="HOUSE">Дом</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Город</label>
            <input type="text" class="form-control" name="city" placeholder="Например, Москва">
          </div>
          <div class="mb-3">
            <label class="form-label">Цена, ₽/мес</label>
            <div class="d-flex gap-2">
              <input type="number" class="form-control" name="priceFrom" placeholder="от">
              <input type="number" class="form-control" name="priceTo" placeholder="до">
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Показать</button>
          <button type="reset" class="btn btn-link w-100 mt-1">Сбросить</button>
        </form>
      </aside>

      <!-- список объектов -->
      <section class="col-lg-9" aria-label="Результаты поиска">
        <p class="text-muted" id="found-count"></p>
        <div class="row g-3" id="properties">
          <p>Загрузка...</p>
        </div>
      </section>
    </div>
  </main>

  <footer class="text-center text-muted py-4">© 2026 Snimu</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
