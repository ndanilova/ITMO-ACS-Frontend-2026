<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — Snimu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Snimu</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Поиск</a></li>
          <li class="nav-item"><a class="nav-link" href="messages.html">Сообщения</a></li>
          <li class="nav-item"><a class="nav-link active" href="profile.html">Личный кабинет</a></li>
          <li class="nav-item" id="nav-auth"></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row g-4">
      <div class="col-lg-3">
        <div class="bg-white p-3 rounded text-center" id="user-card"></div>
      </div>

      <div class="col-lg-9">
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#renting" type="button">Я снимаю</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#my-objects" type="button">Я сдаю</button>
          </li>
        </ul>

        <div class="tab-content bg-white p-3 border border-top-0">
          <div class="tab-pane fade show active" id="renting">
            <table class="table align-middle">
              <thead>
                <tr><th>Объект</th><th>Даты</th><th>Сумма</th><th>Статус</th></tr>
              </thead>
              <tbody id="my-rentals"></tbody>
            </table>
          </div>

          <div class="tab-pane fade" id="my-objects">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span>Ваши объявления</span>
              <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">+ Добавить объект</button>
            </div>
            <div class="list-group mb-4" id="my-properties"></div>

            <h3 class="h6">Заявки на мои объекты</h3>
            <div class="list-group" id="requests"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="add-form">
          <div class="modal-header">
            <h5 class="modal-title">Новый объект</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input class="form-control mb-2" name="title" placeholder="Название" required>
            <select class="form-select mb-2" name="type">
              <option value="APARTMENT">Квартира</option>
              <option value="STUDIO">Студия</option>
              <option value="ROOM">Комната</option>
              <option value="HOUSE">Дом</option>
            </select>
            <input class="form-control mb-2" name="city" placeholder="Город" required>
            <input class="form-control mb-2" name="address" placeholder="Адрес" required>
            <input type="number" class="form-control mb-2" name="price" placeholder="Цена за месяц" min="1" required>
            <input class="form-control mb-2" name="amenities" placeholder="Удобства через запятую">
            <textarea class="form-control" name="description" rows="3" placeholder="Описание"></textarea>
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary">Сохранить</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
