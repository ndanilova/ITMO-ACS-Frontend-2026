<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Snimu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#content" class="visually-hidden-focusable skip-link">Перейти к содержимому</a>
  <nav class="navbar navbar-expand-lg surface border-bottom" aria-label="Основная навигация">
    <main id="content" class="container">
      <a class="navbar-brand fw-bold" href="index.html">Snimu</a>
    </div>
  </nav>

  <div class="container">
    <div class="auth-box">
      <h1 class="h2 mb-4">Вход</h1>
      <div class="alert alert-danger d-none" id="error" role="alert"></div>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" placeholder="you@mail.ru" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Пароль</label>
          <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Войти</button>
      </form>
      <p class="mt-3 text-center">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </div>
  </main>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
