<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Snimu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#content" class="visually-hidden-focusable skip-link">Перейти к содержимому</a>
  <nav class="navbar navbar-expand-lg surface border-bottom" aria-label="Основная навигация">
    <main id="content" class="container">
      <a class="navbar-brand fw-bold" href="index.html">Snimu</a>
    </div>
  </nav>

  <div class="container">
    <div class="auth-box">
      <h1 class="h2 mb-4">Регистрация</h1>
      <div class="alert alert-danger d-none" id="error" role="alert"></div>
      <form id="register-form">
        <div class="row">
          <div class="col mb-3">
            <label class="form-label" for="firstName">Имя</label>
            <input type="text" class="form-control" id="firstName" name="firstName" autocomplete="given-name" required>
          </div>
          <div class="col mb-3">
            <label class="form-label" for="lastName">Фамилия</label>
            <input type="text" class="form-control" id="lastName" name="lastName" autocomplete="family-name" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Пароль</label>
          <input type="password" class="form-control" id="password" name="password" minlength="6" autocomplete="new-password" aria-describedby="password-help" required>
          <div class="form-text" id="password-help">Минимум 6 символов</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="role">Я хочу</label>
          <select class="form-select" id="role" name="role">
            <option value="TENANT">снимать жильё</option>
            <option value="LANDLORD">сдавать жильё</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Создать аккаунт</button>
      </form>
      <p class="mt-3 text-center">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
  </main>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
