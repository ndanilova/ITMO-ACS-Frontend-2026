<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Объект — Snimu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Snimu</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Поиск</a></li>
          <li class="nav-item"><a class="nav-link" href="messages.html">Сообщения</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
          <li class="nav-item" id="nav-auth"></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <a href="index.html" class="d-inline-block mb-3">← Назад к поиску</a>

    <div id="property">
      <p>Загрузка...</p>
    </div>
  </div>

  <!-- модалка бронирования -->
  <div class="modal fade" id="bookModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="book-form">
          <div class="modal-header">
            <h5 class="modal-title">Заявка на аренду</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Дата заезда</label>
              <input type="date" class="form-control" name="start" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Дата выезда</label>
              <input type="date" class="form-control" name="end" required>
            </div>
            <p class="mb-0">Итого: <b id="total">—</b></p>
            <div class="alert alert-danger d-none mt-3 mb-0" id="book-error"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
            <button type="submit" class="btn btn-primary">Отправить заявку</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/property.js"></script>
</body>
</html>
