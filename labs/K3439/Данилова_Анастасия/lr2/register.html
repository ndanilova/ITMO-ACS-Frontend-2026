<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Snimu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Snimu</a>
    </div>
  </nav>

  <div class="container">
    <div class="auth-box">
      <h2 class="mb-4">Регистрация</h2>
      <form id="register-form">
        <div class="row">
          <div class="col mb-3">
            <label class="form-label">Имя</label>
            <input type="text" class="form-control" required>
          </div>
          <div class="col mb-3">
            <label class="form-label">Фамилия</label>
            <input type="text" class="form-control" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-control" minlength="6" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Я хочу</label>
          <select class="form-select">
            <option value="TENANT">снимать жильё</option>
            <option value="LANDLORD">сдавать жильё</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Создать аккаунт</button>
      </form>
      <p class="mt-3 text-center">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
